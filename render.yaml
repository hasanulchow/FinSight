# Render blueprint: New -> Blueprint -> select this repo. Fill the secret env vars when prompted.
# One service: builds the Expo web app (mobile/dist) and serves it from the Express API on the same origin.
services:
  - type: web
    name: finsight
    runtime: node
    plan: starter # agents run in the background after the response; free instances can sleep mid-briefing
    buildCommand: npm ci --prefix server && npm ci --prefix mobile && npm run build:web --prefix mobile
    startCommand: npm start --prefix server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: LLM_MODEL
        value: claude-sonnet-5-5
      - key: EVAL_MODEL
        value: claude-sonnet-5-5
      - key: EMBEDDING_MODEL
        value: voyage-4
      - key: BRIEFINGS_PER_HOUR
        value: "20"
      - key: QUESTIONS_PER_HOUR
        value: "60"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VOYAGE_API_KEY # optional: without it, filing search uses keyword matching
        sync: false
      - key: MASSIVE_API_KEY # price history for technical analysis, screener and indicator alerts (Massive, formerly Polygon.io)
        sync: false
      - key: JOBS_INTERVAL_MINUTES # alerts, screener refresh and daily digests run in-process on this schedule
        value: "10"
      - key: CRON_SECRET # protects POST /jobs/run for external schedulers
        generateValue: true
      - key: STRIPE_SECRET_KEY # billing (optional): without Stripe keys everyone stays on the Free plan
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO # Stripe price id of the Pro subscription
        sync: false
      - key: APP_URL # public URL, used for Stripe redirects, share and referral links
        sync: false
      - key: TRIAL_DAYS # free trial on the first Pro subscription
        value: "7"
      - key: SNAPTRADE_CLIENT_ID # broker sync (optional)
        sync: false
      - key: SNAPTRADE_CONSUMER_KEY
        sync: false
      - key: ENCRYPTION_KEY # encrypts broker secrets at rest
        generateValue: true
      - key: POSTHOG_KEY # product analytics (optional)
        sync: false
      - key: ADMIN_EMAILS # who can open the founder dashboard
        sync: false
      - key: BROKER_TRADING_ENABLED # real-money orders via SnapTrade; keep false until legal sign-off
        value: "false"
      - key: RESEND_API_KEY # weekly email reports (optional)
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: STRIPE_PRICE_PRO_ANNUAL # yearly plan (optional)
        sync: false
      - key: STRIPE_RETENTION_COUPON # cancel-flow discount (optional)
        sync: false
      - key: SENTRY_DSN # error monitoring (optional)
        sync: false
      # Baked into the web bundle at build time: Supabase URL + anon/publishable key only
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
