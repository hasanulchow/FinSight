# Render blueprint: New -> Blueprint -> select this repo. Fill the secret env vars in the dashboard.
# One service: builds the Expo web app (mobile/dist) and serves it from the Node API on the same origin.
services:
  - type: web
    name: finsight-api
    runtime: node
    buildCommand: cd server && npm ci && cd ../mobile && npm ci && npm run build:web
    startCommand: cd server && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: LLM_MODEL
        value: claude-sonnet-5-5
      - key: EVAL_MODEL
        value: claude-sonnet-5-5
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      # Baked into the web bundle at build time: Supabase URL + anon/publishable key only
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
